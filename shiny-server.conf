run_as shiny;
preserve_logs true;

server {
  listen 3838;

  # Explicitly map dashboard app route.
  location /cie-dashboards {
    app_dir /srv/shiny-server/cie-dashboards;
    log_dir /var/log/shiny-server;

    # Keep the R process alive between visits. It defaults to 5 seconds, so nearly
    # every visitor was paying the full cold start (reading all.csv, ~8s) again.
    # The process is still replaced whenever the app files change, which is what
    # process_write()'s `touch ../cie-dashboards/*.R` does after every upload.
    app_idle_timeout 0;
  }

  # Explicitly map uploads app route.
  location /cie-uploads {
    app_dir /srv/shiny-server/cie-uploads;
    log_dir /var/log/shiny-server;
    app_idle_timeout 0;
  }

  # Keep root browsable for static files and directory index.
  location / {
    site_dir /srv/shiny-server;
    log_dir /var/log/shiny-server;
    directory_index on;
  }
}